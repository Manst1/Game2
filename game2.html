<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ulgarienef Memory Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .card-inner {
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            backface-visibility: hidden;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.75rem;
        }
        .card-back {
            transform: rotateY(180deg);
        }
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 0.6rem;
            width: 100%;
            max-width: 750px;
        }
    </style>
</head>
<body class="bg-zinc-100 min-h-screen flex flex-col items-center p-4 font-sans">

    <div class="w-full max-w-2xl flex justify-between items-end mb-6 mt-2">
        <div>
            <h1 class="text-3xl font-black text-blue-700 uppercase tracking-tighter">Ulgarienef Memory</h1>
            <p class="text-zinc-500 font-bold text-sm">Match the Image to the Translation</p>
        </div>
        <div class="bg-white px-5 py-2 rounded-2xl shadow-sm border border-zinc-200 text-right">
            <div id="moves" class="text-xl font-bold text-zinc-800">Moves: 0</div>
            <div id="matches-label" class="text-xs font-black text-green-600 uppercase">Matches: 0 / 18</div>
        </div>
    </div>

    <div id="grid" class="memory-grid aspect-square"></div>

    <button onclick="startGame()" class="mt-8 bg-blue-600 hover:bg-blue-700 text-white px-10 py-3 rounded-full font-bold shadow-lg transition-all transform hover:scale-105 active:scale-95">
        New Random Board
    </button>

    <div id="win-screen" class="fixed inset-0 bg-blue-900/90 backdrop-blur-md flex items-center justify-center z-50 hidden">
        <div class="bg-white p-10 rounded-3xl text-center shadow-2xl">
            <h2 class="text-4xl font-black text-zinc-800 mb-2">Victory!</h2>

            <button onclick="startGame()" class="bg-blue-600 hover:bg-blue-700 text-white px-12 py-4 rounded-full font-black text-xl shadow-xl">PLAY AGAIN</button>

            { word: "Emerald", translation: "Inkill", testTranslations: ["Inkill"], image: "https://i.imgur.com/SYgRQLn.png", link: "https://example.com/dog" },					
            { word: "Purse / Wallet", translation: "Geet", testTranslations: ["Geet"], image: "https://i.imgur.com/8NeGj44.png", link: "https://example.com/dog" }			
            // Add as many more as you want...
        ];

        let flippedCards = [];
        let moves = 0;
        let matches = 0;
        let canFlip = true;

        function startGame() {
            document.getElementById('win-screen').classList.add('hidden');
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            flippedCards = [];
            moves = 0;
            matches = 0;
            canFlip = true;
            document.getElementById('moves').textContent = `Moves: 0`;
            document.getElementById('matches-label').textContent = `Matches: 0 / 18`;

            // 1. Shuffle entire vocabulary pool
            const totalPool = [...vocabulary].sort(() => Math.random() - 0.5);

            // 2. Select 18 random items (looping if the list is smaller than 18)
            const selection = [];
            for (let i = 0; i < 18; i++) {
                selection.push(totalPool[i % totalPool.length]);
            }

            // 3. Create 36 cards using the 'translation' field
            let gameItems = [];
            selection.forEach(item => {
                gameItems.push({ type: 'text', content: item.translation });
                gameItems.push({ type: 'img', content: item.image, matchKey: item.translation });
            });

            // 4. Shuffle the final 36 cards
            gameItems.sort(() => Math.random() - 0.5);

            // 5. Render
            gameItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card relative cursor-pointer';
                card.dataset.match = item.type === 'text' ? item.content : item.matchKey;
                
                card.innerHTML = `
                    <div class="card-inner w-full h-full relative">
                        <div class="card-front bg-blue-600 border-b-4 border-blue-800 shadow-md">
                             <div class="w-5 h-5 rounded-full bg-white/20"></div>
                        </div>
                        <div class="card-back bg-white border-2 border-blue-500 p-1 shadow-inner">
                            ${item.type === 'text' 
                                ? `<span class="text-blue-900 font-black text-xs sm:text-sm md:text-base text-center leading-tight uppercase px-1">${item.content}</span>` 
                                : `<img src="${item.content}" class="w-full h-full object-contain pointer-events-none p-1">`
                            }
                        </div>
                    </div>
                `;
                
                card.onclick = () => flipCard(card);
                grid.appendChild(card);
            });
        }

        function flipCard(card) {
            if (!canFlip || card.classList.contains('flipped') || card.classList.contains('matched')) return;
            card.classList.add('flipped');
            flippedCards.push(card);
            if (flippedCards.length === 2) {
                moves++;
                document.getElementById('moves').textContent = `Moves: ${moves}`;
                checkMatch();
            }
        }

        function checkMatch() {
            canFlip = false;
            const [c1, c2] = flippedCards;
            if (c1.dataset.match === c2.dataset.match) {
                matches++;
                document.getElementById('matches-label').textContent = `Matches: ${matches} / 18`;
                c1.classList.add('matched');
                c2.classList.add('matched');
                c1.querySelector('.card-back').classList.add('bg-green-50', 'border-green-500');
                c2.querySelector('.card-back').classList.add('bg-green-50', 'border-green-500');
                flippedCards = [];
                canFlip = true;
                if (matches === 18) {
                    setTimeout(() => {
                        document.getElementById('final-stats').textContent = `Board cleared in ${moves} moves!`;
                        document.getElementById('win-screen').classList.remove('hidden');
                    }, 600);
                }
            } else {
                setTimeout(() => {
                    c1.classList.remove('flipped');
                    c2.classList.remove('flipped');
                    flippedCards = [];
                    canFlip = true;
                }, 1000);
            }
        }

        startGame();
    </script>
</body>
</html>
